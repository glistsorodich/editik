<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ЖЁСТКИЙ ЭДИТ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Arial Black', sans-serif;
  }

  #startScreen {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    z-index:10;
    transition: opacity .4s;
  }
  #startBtn {
    padding: 22px 60px;
    font-size: 28px;
    letter-spacing: 4px;
    color:#fff;
    background:#000;
    border: 3px solid #fff;
    cursor:pointer;
    text-transform:uppercase;
    transition: all .15s;
    animation: pulse 1.2s infinite;
  }
  #startBtn:hover {
    background:#fff; color:#000;
    transform: scale(1.08);
    box-shadow: 0 0 40px #fff;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
    50%     { box-shadow: 0 0 30px rgba(255,255,255,.8); }
  }

  #editScreen {
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:#000;
    z-index:5;
    overflow:hidden;
  }

  #curtain {
    position:absolute;
    inset:0;
    background:#000;
    z-index:2;
    transform: translateY(0);
    transition: transform 2.5s cubic-bezier(.16,1,.3,1);
  }
  #curtain.open {
    transform: translateY(-100%);
  }

  #mainPhoto {
    max-width:60vw;
    max-height:75vh;
    object-fit:contain;
    position:relative;
    z-index:1;
    filter: brightness(0) drop-shadow(0 0 0 rgba(255,255,255,0));
    transform: translateY(40px) scale(.9);
    transition: filter 2s ease, transform 2s cubic-bezier(.16,1,.3,1), drop-shadow .6s;
  }
  #mainPhoto.show {
    filter: brightness(1) drop-shadow(0 0 40px rgba(255,255,255,.45));
    transform: translateY(0) scale(1);
    animation: glowPulse 2.4s infinite ease-in-out;
  }
  @keyframes glowPulse {
    0%,100% { filter: brightness(1) drop-shadow(0 0 30px rgba(255,255,255,.35)); }
    50%     { filter: brightness(1.08) drop-shadow(0 0 70px rgba(255,255,255,.8)); }
  }

  .flyer {
    position:absolute;
    width: 16vw;
    max-width: 230px;
    object-fit: contain;
    opacity:0;
    z-index:3;
    filter: drop-shadow(0 0 20px rgba(255,255,255,.5));
    pointer-events:none;
    will-change: transform;
    transition: opacity .6s;
  }
  .flyer.show { opacity:1; }

  .flyer.f1 { top: 8%;  left: 6%;  }
  .flyer.f2 { top: 12%; right: 7%; }
  .flyer.f3 { bottom: 10%; left: 50%; transform: translateX(-50%); }

  #finalText {
    position:fixed;
    bottom:5%;
    left:50%;
    transform: translateX(-50%);
    color:#fff;
    font-size: 1.8vw;
    letter-spacing: 6px;
    opacity:0;
    z-index:4;
    transition: opacity 1.2s;
    text-transform:uppercase;
    text-shadow: 0 0 20px rgba(255,255,255,.6);
    white-space:nowrap;
  }
  #finalText.show { opacity:.9; }
</style>
</head>
<body>

<div id="startScreen">
  <button id="startBtn">▶ ЖЁСТКИЙ МОГГСИМ</button>
</div>

<div id="editScreen">
  <img id="mainPhoto" src="friend.png" alt="друг">
  <div id="curtain"></div>
  <img class="flyer f1" src="img1.png" alt="">
  <img class="flyer f2" src="img2.png" alt="">
  <img class="flyer f3" src="img3.png" alt="">
  <div id="finalText">юзер соляры</div>
</div>

<audio id="music" src="music.mp3" loop></audio>

<script>
  const startScreen = document.getElementById('startScreen');
  const startBtn    = document.getElementById('startBtn');
  const editScreen  = document.getElementById('editScreen');
  const mainPhoto   = document.getElementById('mainPhoto');
  const curtain     = document.getElementById('curtain');
  const finalText   = document.getElementById('finalText');
  const music       = document.getElementById('music');
  const flyers      = document.querySelectorAll('.flyer');

  function startShake(el, intensity) {
    let baseTransform = el.classList.contains('f3') ? 'translateX(-50%)' : '';
    function tick() {
      if (!el.classList.contains('show')) { requestAnimationFrame(tick); return; }
      const dx = (Math.random() - 0.5) * intensity * 2;
      const dy = (Math.random() - 0.5) * intensity * 2;
      const rot = (Math.random() - 0.5) * intensity * 3;
      const sc  = 1 + (Math.random() - 0.5) * 0.08;
      el.style.transform = `${baseTransform} translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(${sc})`;
      setTimeout(tick, 40 + Math.random() * 80);
    }
    tick();
  }

  startShake(flyers[0], 8);
  startShake(flyers[1], 10);
  startShake(flyers[2], 7);

  startBtn.addEventListener('click', () => {
    startScreen.style.opacity = '0';
    setTimeout(() => startScreen.style.display = 'none', 400);

    music.volume = 0.8;
    music.play().catch(() => {});

    editScreen.style.display = 'flex';

    setTimeout(() => mainPhoto.classList.add('show'), 200);

    setTimeout(() => curtain.classList.add('open'), 800);

    setTimeout(() => {
      flyers.forEach(f => f.classList.add('show'));
    }, 1400);

    setTimeout(() => finalText.classList.add('show'), 3200);
  });

  mainPhoto.addEventListener('click', () => {
    if (music.paused) music.play();
    else music.pause();
  });
</script>
</body>
</html>
